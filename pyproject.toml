[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-impact-engine"
version = "0.1.0"
description = "Cohort-level scholarly impact metrics from Scopus with configurable time windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scholar Impact Engine contributors" }]
keywords = [
    "scopus",
    "impact",
    "bibliometrics",
    "scientometrics",
    "scholarly-metrics",
    "pybliometrics",
]
dependencies = [
    "pandas>=1.4",
    "pybliometrics>=3.4",
    "PyYAML>=6.0",
    "tqdm>=4.64",
    "openpyxl>=3.0",
]

[project.scripts]
scholar-impact-engine = "scholar_impact_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
